name: Collect public Algerian tender listings

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependencies
        run: pip install -r backend/requirements.txt
      - name: Test real public listing collection
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.main import SessionLocal
          from app.collector import collect_public_tenders
          result = collect_public_tenders(SessionLocal, max_pages=2)
          print(result)
          if result["records_seen"] == 0:
              raise SystemExit("No public tender records were parsed. The source may have changed or blocked the request.")
          PY
